name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    env:
      TOOLCHAIN_URI: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: toolchain
          key: toolchain-${{ env.TOOLCHAIN_URI }}

      - name: Get toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang/host/linux-x86
          curl -LSs "${{ env.TOOLCHAIN_URI }}" |
            tar -xzf - -C toolchain/clang/host/linux-x86

      - name: Setup toolchain path
        run: |
          echo "${{ github.workspace }}/toolchain/clang/host/linux-x86/bin" >> "$GITHUB_PATH"

      - name: Check LLVM
        run: |
          echo "===== LLVM TOOLCHAIN ====="
          which clang
          which ld.lld
          which llvm-objdump
          which llvm-ar
          which llvm-nm

          echo "===== VERSIONS ====="
          clang --version
          ld.lld --version
          llvm-objdump --version

      - name: KSU
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" |
            bash -s M freea

      - name: AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git

      - name: Build
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 exynos9830_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 r8s.config
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

      - name: Build AnyKernel package
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() {
          kernel.string=alessandro r8s KernelSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=r8s
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cd AnyKernel3
          zip -r9 "../alessandro-r8s-KernelSU.zip" * \
            -x .git .github README.md '*placeholder'

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel package
          path: alessandro-r8s-KernelSU.zip
